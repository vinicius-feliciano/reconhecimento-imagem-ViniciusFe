<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IA Vision - Teachable Machine</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .main-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            padding: 2rem;
            margin-top: 2rem;
        }

        #webcam-container {
            border: 4px solid #0d6efd;
            border-radius: 10px;
            overflow: hidden;
            display: inline-block;
            background: #000;
            line-height: 0;
        }

        canvas {
            max-width: 100%;
            height: auto !important; /* Mantém a proporção responsiva */
        }

        .prediction-badge {
            background: #2d2d2d;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 5px solid #0d6efd;
            font-weight: 500;
            text-align: left;
            transition: all 0.3s ease;
        }

        .btn-start {
            padding: 12px 30px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            
            <div class="main-card">
                <h2 class="mb-4 text-primary">Teachable Machine Image Model</h2>
                <p class="text-secondary mb-4">Clique no botão abaixo para iniciar a detecção em tempo real via Webcam.</p>
                
                <button class="btn btn-primary btn-lg btn-start mb-4 shadow" type="button" onclick="init()">
                    ⚡ Iniciar Câmera
                </button>

                <div class="row mt-2">
                    <div class="col-lg-6 mb-4">
                        <div id="webcam-container" class="shadow-lg"></div>
                    </div>

                    <div class="col-lg-6">
                        <h5 class="mb-3 text-secondary">Resultados da Análise:</h5>
                        <div id="label-container" class="d-flex flex-column">
                            </div>
                    </div>
                </div>
            </div>

            <p class="mt-4 text-muted" style="font-size: 0.8rem;">Powered by TensorFlow.js & Bootstrap</p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    const URL = "https://teachablemachine.withgoogle.com/models/wu4Rm22f_/";

    let model, webcam, labelContainer, maxPredictions;

    async function init() {
        // Esconde o botão após clicar para evitar múltiplos carregamentos
        document.querySelector('.btn-start').disabled = true;
        document.querySelector('.btn-start').innerText = "Carregando...";

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        const flip = true; 
        webcam = new tmImage.Webcam(300, 300, flip); // Aumentei um pouco o tamanho base
        await webcam.setup(); 
        await webcam.play();
        window.requestAnimationFrame(loop);

        // Limpa containers caso já existam (segurança)
        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("label-container").innerHTML = "";

        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        
        for (let i = 0; i < maxPredictions; i++) {
            const div = document.createElement("div");
            div.className = "prediction-badge";
            labelContainer.appendChild(div);
        }

        document.querySelector('.btn-start').innerText = "Sistema Ativo";
    }

    async function loop() {
        webcam.update(); 
        await predict();
        window.requestAnimationFrame(loop);
    }

    async function predict() {
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction = `
                <div class="d-flex justify-content-between">
                    <span>${prediction[i].className}</span>
                    <span class="badge bg-primary">${(prediction[i].probability * 100).toFixed(0)}%</span>
                </div>
            `;
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }
    }
</script>

</body>
</html>
